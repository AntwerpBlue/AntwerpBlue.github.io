title                    : "Zhaochen Wang"
title_separator          : "·"
description              : "Quantitative research, market microstructure, and machine learning."
locale                   : "en"
repository               : "AntwerpBlue/AntwerpBlue.github.io"
url                      : "https://antwerpblue.github.io"
baseurl                  : ""

author:
  name             : "Zhaochen Wang"
  avatar           : "avatar-placeholder.svg"
  bio              : "Quantitative Research · Market Microstructure · Machine Learning"
  email            : "orenwang@mail.ustc.edu.cn"
  github           : "AntwerpBlue"

include:
  - _pages

exclude:
  - .bundle
  - .github
  - .jekyll-cache
  - .sass-cache
  - .gitignore
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - README.md
  - assets/js/_main.js
  - assets/js/plugins
  - node_modules
  - package.json
  - vendor

encoding: "utf-8"
markdown_ext: "markdown,mkdown,mkdn,mkd,md"

markdown: kramdown
highlighter: rouge
lsi: false
excerpt_separator: "\n\n"
incremental: false

kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  enable_coderay: false

defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: default
      author_profile: true

sass:
  sass_dir: _sass
  style: compressed

permalink: /:categories/:title/
timezone: Asia/Shanghai

plugins:
  - jekyll-sitemap
  - jekyll-redirect-from

compress_html:
  clippings: all
  ignore:
    envs: development

